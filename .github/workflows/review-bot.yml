# Opens a PR for every pushed `bot/...` branch, authored by github-actions[bot], and asks the repo owner to review it.
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Review bot

on:
  push:
    branches: ['bot/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open a PR and request the owner's review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A PR for $BRANCH already exists"; exit 0
          fi
          title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" \
            --body "Opened by the review-bot workflow for \`$BRANCH\`." \
            --reviewer "$OWNER"
