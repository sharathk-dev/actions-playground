name: build-workflow.yml
on: push

jobs:
  test_build:
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@v7
      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: build-project
        run: ./mvnw clean install
  deploy:
    needs: test_build
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@v7
      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: deploy-project
        run: echo "deploying..."